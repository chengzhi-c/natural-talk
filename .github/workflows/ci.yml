name: ci

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build check (core/rules.yaml -> dist/*)
        run: python scripts/build.py --check
      - name: Sync check
        run: python scripts/check-sync.py
      - name: Cases
        run: python scripts/check.py
      - name: Bench (token/speed/F1 gate)
        run: python scripts/bench.py
      - name: Eval smoke (no network)
        run: python scripts/eval-llm.py --list
