name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repo:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -B tests/check_repo.py
